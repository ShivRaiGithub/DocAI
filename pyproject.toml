[project]
name = "docai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "mcp>=2.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Qdrant's in-memory test mode ignores payload indexes; the real server uses them.
    "ignore:Payload indexes have no effect:UserWarning",
    # LangSmith's offline evaluation (used in tests/test_evaluation.py) is flagged beta
    "ignore::langsmith._internal._beta_decorator.LangSmithBetaWarning",
    "ignore:ast.Str is deprecated:DeprecationWarning",
]
